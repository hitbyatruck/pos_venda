{% load static %}
<!-- Main Navigation Menu -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'core:dashboard' %}">
      <i class="fas fa-tools me-2"></i>PósVenda
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <!-- Dashboard Link -->
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
             href="{% url 'core:dashboard' %}">
            <i class="fas fa-tachometer-alt me-1"></i> Dashboard
          </a>
        </li>

        <!-- Clientes Link -->
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.app_name == 'clientes' %}active{% endif %}"
             href="{% url 'clientes:listar_clientes' %}">
            <i class="fas fa-users me-1"></i> Clientes
          </a>
        </li>

        <!-- Equipamentos Link -->
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.app_name == 'equipamentos' %}active{% endif %}"
             href="{% url 'equipamentos:listar_fabricados' %}">
            <i class="fas fa-cogs me-1"></i> Equipamentos
          </a>
        </li>

        <!-- Assistência Link -->
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.app_name == 'assistencia' %}active{% endif %}"
             href="{% url 'assistencia:listar_pats' %}">
            <i class="fas fa-tools me-1"></i> Assistência
          </a>
        </li>

        <!-- Stock Link -->
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.app_name == 'stock' %}active{% endif %}"
             href="{% url 'stock:listar_pecas' %}">
            <i class="fas fa-boxes me-1"></i> Stock
          </a>
        </li>

        <!-- Notas Link -->
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.app_name == 'notas' %}active{% endif %}"
             href="{% url 'notas:listar_notas' %}">
            <i class="fas fa-sticky-note me-1"></i> Notas
          </a>
        </li>
      </ul>

      <!-- Right Side Menu Items -->
      <ul class="navbar-nav">
        <!-- Search Form -->
        <li class="nav-item me-2">
          <form class="d-flex" action="{% url 'search_global' %}" method="get">
            <div class="input-group">
              <input class="form-control" type="search" name="q" placeholder="Pesquisar..." aria-label="Search">
              <button class="btn btn-light" type="submit">
                <i class="fas fa-search"></i>
              </button>
            </div>
          </form>
        </li>

        <!-- Dark mode toggle button -->
        <li class="nav-item me-2">
          <button class="btn btn-outline-light" id="darkModeToggle" title="Alternar modo escuro/claro">
            <i class="fas fa-moon"></i>
          </button>
        </li>

        <!-- Definições Dropdown -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownSettings" role="button"
             data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-cog me-1"></i>
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownSettings">
            <li>
              <a class="dropdown-item" href="{% url 'core:settings_dashboard' %}">
                <i class="fas fa-sliders-h me-2"></i>Definições
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="{% url 'admin:index' %}">
                <i class="fas fa-user-shield me-2"></i>Administração
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item" href="{% url 'logout' %}">
                <i class="fas fa-sign-out-alt me-2"></i>Sair
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<script>
  // Initialize dark mode from localStorage
  document.addEventListener('DOMContentLoaded', function () {
    const darkModeToggle = document.getElementById('darkModeToggle');
    const htmlElement = document.documentElement;

    // Check if user has a preference saved
    const darkModeEnabled = localStorage.getItem('darkMode') === 'enabled';

    // Apply dark mode if enabled
    if (darkModeEnabled) {
      htmlElement.setAttribute('data-bs-theme', 'dark');
      darkModeToggle.innerHTML = '<i class="fas fa-sun"></i>';
    } else {
      htmlElement.setAttribute('data-bs-theme', 'light');
      darkModeToggle.innerHTML = '<i class="fas fa-moon"></i>';
    }

    // Toggle dark mode on button click
    darkModeToggle.addEventListener('click', function () {
      if (htmlElement.getAttribute('data-bs-theme') === 'dark') {
        htmlElement.setAttribute('data-bs-theme', 'light');
        localStorage.setItem('darkMode', 'disabled');
        darkModeToggle.innerHTML = '<i class="fas fa-moon"></i>';
      } else {
        htmlElement.setAttribute('data-bs-theme', 'dark');
        localStorage.setItem('darkMode', 'enabled');
        darkModeToggle.innerHTML = '<i class="fas fa-sun"></i>';
      }
    });
  });
</script>
