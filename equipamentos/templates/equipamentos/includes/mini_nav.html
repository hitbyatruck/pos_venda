{% load i18n %}

<div class="card shadow-sm mb-4">
    <div class="card-body p-0">
        <ul class="nav nav-tabs card-header-tabs">
            <li class="nav-item">
                <a href="{% url 'equipamentos:listar_equipamentos' %}" class="nav-link {% if nav_active == 'equipamentos' %}active{% endif %}">
                    <i class="fas fa-layer-group me-1"></i> {% trans "Todos os Equipamentos" %}
                </a>
            </li>
            <li class="nav-item">
