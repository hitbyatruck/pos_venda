{% load i18n %}
<div class="card mb-4 border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="nav-scroller mb-4">
            <nav class="nav nav-underline" aria-label="Navegação de clientes">
                <a class="nav-link {% if active_tab == 'all' %}active{% endif %}" href="{% url 'clientes:listar_clientes' %}">
                    <i class="fas fa-users me-1"></i> {% trans "Todos os Clientes" %}
                </a>
                <a class="nav-link {% if active_tab == 'contactos' %}active{% endif %}" href="{% url 'clientes:listar_contactos' %}">
                    <i class="fas fa-address-book me-1"></i> {% trans "Livro de Contactos" %}
                </a>
            </nav>
        </div>

        <style>
            /* Mini navigation styling to match Equipamentos app */
            .nav-tabs {
                border-bottom: 1px solid #dee2e6;
            }

            .nav-tabs .nav-link {
                margin-bottom: -1px;
                border: 1px solid transparent;
                border-top-left-radius: 0.5rem;
                border-top-right-radius: 0.5rem;
                padding: 0.75rem 1.25rem;
                font-weight: 500;
                font-size: 0.95rem;
                transition: all 0.2s ease;
            }

            .nav-tabs .nav-link:hover:not(.active) {
                background-color: #f8f9fa;
                border-color: #e9ecef #e9ecef #dee2e6;
            }

            .nav-tabs .nav-link.active {
                color: #0d6efd;
                background-color: #fff;
                border-color: #dee2e6 #dee2e6 #fff;
                font-weight: 600;
            }

            /* Dark mode support */
            [data-bs-theme="dark"] .nav-tabs .nav-link.active {
                background-color: #212529;
                color: #0d6efd;
                border-color: #495057 #495057 #212529;
            }

            [data-bs-theme="dark"] .nav-tabs .nav-link:hover:not(.active) {
                background-color: #343a40;
                border-color: #495057 #495057 #495057;
            }

            /* Make tabs responsive */
            @media (max-width: 768px) {
                .nav-tabs {
                    flex-wrap: nowrap;
                    overflow-x: auto;
                    white-space: nowrap;
                    -webkit-overflow-scrolling: touch;
                }

                .nav-tabs .nav-link {
                    padding: 0.5rem 1rem;
                    font-size: 0.9rem;
                }
            }
        </style>
    </div>
</div>
